[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devpy-cli"
version = "2.0.0"
description = "AI-powered DevOps CLI Assistant for local and remote Docker management"
readme = "README.md"
authors = [{ name = "Eddy Ortega", email = "atrox390@gmail.com" }]
license = { text = "MIT" }
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: System :: Systems Administration",
  "Topic :: Software Development :: Build Tools",
]
dependencies = [
  "docker>=7.0.0",
  "paramiko>=3.4.0",
  "cryptography>=42.0.0",
  "rich>=13.7.0",
  "typer>=0.9.0",
  "langchain>=0.1.0",
  "langchain-core>=0.1.0",
  "langchain-openai>=0.0.5",
  "langchain-anthropic>=0.1.0",
  "langchain-google-genai>=1.0.0",
  "langchain-ollama>=0.1.0",
  "langgraph>=0.2.0",
  "python-dotenv>=1.0.0",
  "psutil>=5.9.0",
]
requires-python = ">=3.11"

[project.scripts]
devpy-cli = "devpy.cli.app:run_cli"

[project.urls]
"Homepage" = "https://github.com/angyxys/devpy-cli"
"Bug Tracker" = "https://github.com/angyxys/devpy-cli/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
